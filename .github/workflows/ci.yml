name: CI/CD Laravel + Docker

on:
  push:
    branches:
      - nom_prenom_burger  # Exécuter le pipeline seulement sur cette branche

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le code depuis GitHub
        uses: actions/checkout@v3  # Récupère le projet depuis GitHub

      - name: Installer PHP et Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          tools: composer

      - name: Installer les dépendances Laravel
        run: composer install --no-dev --optimize-autoloader
